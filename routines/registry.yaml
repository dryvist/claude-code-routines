# Consumer-side registry: which prompt each routine renders, plus the schedule
# and runtime knobs that belong to the consumer rather than the catalog.
#
# One routine remains. The seven cloud routines were retired on 2026-08-06 with
# the Anthropic cloud-routine substrate they ran on — see docs/RETIREMENT.md.
# Their bodies are kept in the catalog at `status: retired` for history, and
# their trigger ids are recorded there and in AGENTS.md so none is ever reused.
#
# issue-solver never ran on that substrate. It runs in GitHub Actions on a
# GitHub App token, which is why it survived and why it has no `trigger_id`:
# its schedule lives in .github/workflows/issue-solver.yml, not here.
version: 1
catalog:
  repository: dryvist/ai-llm-prompts
  commit: 1dbf71d7a80db24a0b9ef1973736d25964ffc5fb
  path_prefix: automation
routines:
  issue-solver:
    prompt: issue-solver.md
    name: issue-solver
    allowed_tools: [Read, Write, Edit, Glob, Grep, WebFetch, Task, Bash]
