---
# Render check — the pinned catalog stores the prompt body with flattened
# `<!-- include: fragment-<name>.md -->` markers. This workflow proves it renders
# cleanly (no unresolvable or nested includes) and uploads the rendered blob as
# an artifact, so a reviewer sees exactly what issue-solver.yml will feed the
# run step. A broken render here is a broken issue-solver run there.
name: Render routines

# Trigger note: pull_request is listed for completeness, but PR-event
# check suites do not currently fire in this repo (app suites sit queued
# too — pre-existing). The unfiltered push trigger is what reliably runs
# the check on PR branches; the render is ~5s, so the cost is negligible.
on:
  pull_request:
  push:

permissions: {}

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render every routine prompt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Shellcheck the renderer
        run: shellcheck scripts/render-routine.sh

      - name: Render the issue-solver prompt
        run: |
          mkdir -p /tmp/rendered
          scripts/render-routine.sh issue-solver > /tmp/rendered/issue-solver.md
          [ -s /tmp/rendered/issue-solver.md ] || { echo "render produced an empty prompt"; exit 1; }

      - name: Upload rendered prompt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-routines
          path: /tmp/rendered/
          if-no-files-found: error
